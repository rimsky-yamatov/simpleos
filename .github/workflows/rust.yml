name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# リリース作成(gh release create)に書き込み権限が必要
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup target add x86_64-unknown-none
          sudo apt-get update
          sudo apt-get install -y grub-pc-bin xorriso mtools

      - name: Build host workspace
        run: cargo build --target x86_64-unknown-linux-gnu -p basic_core -p simpleos-emulator --verbose

      - name: Build kernel image
        env:
          RUSTFLAGS: "-C link-arg=-T${{ github.workspace }}/kernel/linker.ld -C link-arg=-n -C link-arg=--gc-sections"
        run: |
          cargo build --manifest-path kernel/Cargo.toml --target x86_64-unknown-none --bin kernel --verbose
          cp target/x86_64-unknown-none/debug/kernel kernel.bin

      - name: Build ISO
        run: bash scripts/build_iso.sh

      - name: Upload ISO as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: simpleos-iso
          path: |
            simpleos.iso
            kernel.bin

      # main への push のときだけ自動でリリースを作成する(PR では作らない)
      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" simpleos.iso kernel.bin \
            --target "${{ github.sha }}" \
            --title "SimpleOS $TAG" \
            --generate-notes
