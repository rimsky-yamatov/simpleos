name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup target add x86_64-unknown-none
          sudo apt-get update
          sudo apt-get install -y grub-pc-bin xorriso

      - name: Build host workspace
        run: cargo build -p basic_core -p simpleos-emulator --verbose

      - name: Build kernel image
        run: |
          cargo build --manifest-path kernel/Cargo.toml --target x86_64-unknown-none --bin kernel --verbose
          ld -n --gc-sections -T kernel/linker.ld -o kernel.bin target/x86_64-unknown-none/debug/kernel

      - name: Build ISO
        run: bash scripts/build_iso.sh
