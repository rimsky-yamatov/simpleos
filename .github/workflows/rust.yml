name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup target add x86_64-unknown-none
          sudo apt-get update
          sudo apt-get install -y grub-pc-bin xorriso mtools

      - name: Build host workspace
        run: cargo build --target x86_64-unknown-linux-gnu -p basic_core -p simpleos-emulator --verbose

      - name: Build kernel image
        env:
          RUSTFLAGS: "-C link-arg=-T${{ github.workspace }}/kernel/linker.ld -C link-arg=-n -C link-arg=--gc-sections"
        run: |
          cargo build --manifest-path kernel/Cargo.toml --target x86_64-unknown-none --bin kernel --verbose
          cp target/x86_64-unknown-none/debug/kernel kernel.bin

      - name: Build ISO
        run: bash scripts/build_iso.sh
