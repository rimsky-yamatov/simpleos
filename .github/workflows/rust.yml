name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# リリース作成(gh release create)に書き込み権限が必要
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup target add x86_64-unknown-none
          sudo apt-get update
          sudo apt-get install -y grub-pc-bin xorriso mtools

      - name: Build and test host workspace
        run: |
          cargo build -p basic_core -p simpleos-emulator --verbose
          cargo test -p basic_core --verbose

      - name: Build kernel and ISO
        run: bash scripts/build_iso.sh

      # QEMU でブートして、シリアル経由で BASIC を実行できるか確認する
      - name: Boot test (QEMU)
        continue-on-error: true
        run: |
          sudo apt-get install -y qemu-system-x86
          (sleep 5; printf 'RUN DEMO\r'; sleep 3; printf 'EXIT\r'; sleep 2) \
            | timeout 60 qemu-system-x86_64 -m 128M -cdrom simpleos.iso -display none -serial stdio -no-reboot > boot.log || true
          cat boot.log
          grep -q "LOOP 3" boot.log

      - name: Upload ISO as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: simpleos-iso
          path: |
            simpleos.iso
            kernel.bin

      # main への push のときだけ自動でリリースを作成する(PR では作らない)
      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" simpleos.iso kernel.bin \
            --target "${{ github.sha }}" \
            --title "SimpleOS $TAG" \
            --generate-notes
